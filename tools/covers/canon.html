<!doctype html>
<meta charset="utf-8">
<title>Canon cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="covers.css">
<style>body{margin:0}</style>

<article class="cover" style="--bg:#33332C;width:1200px">
  <header class="cover__top">
    <span class="cover__label">Canon</span>
    <span class="cover__status">In Progress</span>
  </header>
  <h2 class="cover__headline">Every prototype,<br>one place.</h2>
  <p class="cover__subhead">From every tool, on one shelf<br>you can see, open and share.</p>
  <footer class="cover__foot">
    <div class="cover__rule"></div>
    <dl class="cover__stats">
      <div class="cover__stat"><b>0</b><span>Uploads</span></div>
      <div class="cover__stat"><b>3</b><span>Skills</span></div>
      <div class="cover__stat"><b>373</b><span>Tests</span></div>
      <div class="cover__stat"><b>MIT</b><span>License</span></div>
    </dl>
  </footer>
</article>
