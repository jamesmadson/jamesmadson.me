<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A dot at 33% of the square. Ink follows the viewer's color
       scheme; background stays transparent. -->
  <circle cx="16" cy="16" r="5.28" fill="#33352E"/>
  <style>
    @media (prefers-color-scheme: dark) {
      circle { fill: #EDEEE8; }
    }
  </style>
</svg>
